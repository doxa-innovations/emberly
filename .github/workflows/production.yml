name: Production

on:
  pull_request:
    branches: [main]
    types: [closed]

permissions:
  contents: read
  packages: write
  id-token: write

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  build:
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.ref == 'staging' &&
      github.event.pull_request.head.repo.full_name == github.repository
    uses: doxa-innovations/.github/.github/workflows/doxa-container-build.yml@main
    with:
      source_sha: ${{ github.event.pull_request.head.sha }}
      environment: production
      image: ghcr.io/ephi2github/emberly
      use_infisical: false
